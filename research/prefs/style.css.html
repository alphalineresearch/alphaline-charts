<style>
/* Layout: a research note. One ~68ch reading column; charts and tables break out to a wider measure. Alphaline's navy/gold, dark by design. */
:root {
  color-scheme: dark;
  --navy: #0A1628;
  --panel: #0F1F35;
  --rule: #22364D;
  --text: #E8EDF1;
  --text-2: #B4C2CD;
  --text-3: #8FA2B2;
  --gold: #D4A843;
  --gold-lit: #ECC96A;
  --good: #2ABF7A;
  --bad: #E86A6A;
  --steel: #7A8F9F;
  --display: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
  --body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
  --measure: 68ch;
  --wide: 1040px;
}
* { box-sizing: border-box; }
body { background: var(--navy); color: var(--text); font: 16px/1.65 var(--body); margin: 0; }
.page { padding-inline: 20px; padding-block: 48px 80px; display: flex; flex-direction: column; align-items: center; gap: 0; }
.col { width: 100%; max-width: var(--measure); }
.wide { width: 100%; max-width: var(--wide); }
.eyebrow { font: 500 12px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); display: flex; gap: 10px; align-items: center; }
.eyebrow i { width: 10px; height: 10px; background: var(--gold); display: inline-block; }
h1 { font: 600 clamp(40px, 6vw, 60px)/1.02 var(--display); margin: 18px 0 14px; text-wrap: balance; letter-spacing: -.01em; }
h2 { font: 600 30px/1.15 var(--display); margin: 56px 0 10px; text-wrap: balance; }
h3 { font: 600 13px/1.3 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); margin: 28px 0 8px; }
p { margin: 0 0 14px; color: var(--text-2); }
p strong, li strong { color: var(--text); font-weight: 600; }
.dek { font-size: 19px; line-height: 1.55; color: var(--text-2); }
.meta { font: 13px/1.5 var(--body); color: var(--text-3); margin-top: 10px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* Findings */
.findings { list-style: none; padding: 0; margin: 28px 0 0; display: grid; gap: 0; border-top: 1px solid var(--rule); }
.findings li { display: grid; grid-template-columns: 7.5rem 1fr; gap: 18px; padding: 16px 0; border-bottom: 1px solid var(--rule); }
.findings .t { color: var(--text-2); min-width: 0; }
.chip { align-self: start; font: 600 11px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; padding: 6px 8px; border: 1px solid currentColor; text-align: center; }
.chip.no { color: var(--text-3); }
.chip.mod { color: var(--gold-lit); }
.chip.strong { color: var(--good); }
.chip.watch { color: var(--bad); }

/* Charts */
figure { margin: 28px 0 8px; }
.chart { width: 100%; height: 420px; background: var(--panel); border: 1px solid var(--rule); }
.chart.tall { height: 520px; }
figcaption { font-size: 13px; line-height: 1.5; color: var(--text-3); margin-top: 10px; max-width: var(--measure); }

/* Tables */
.tbl { overflow-x: auto; margin: 14px 0 22px; border: 1px solid var(--rule); background: var(--panel); }
table { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 14px; }
th, td { padding: 9px 12px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--rule); }
th { font: 600 11px/1.3 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
th:first-child, td:first-child { text-align: left; }
td:first-child { font-family: var(--body); }
td { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--text-2); }
tr.sum td { color: var(--text); font-weight: 500; background: rgba(212,168,67,.06); }
tr.base td { color: var(--text-3); }
td.pos { color: var(--good); }
td.neg { color: var(--bad); }

/* Now box */
.now { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); margin: 22px 0 10px; }
.now div { background: var(--panel); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.now b { font: 500 26px/1.1 var(--mono); color: var(--text); font-variant-numeric: tabular-nums; }
.now span { font-size: 12px; color: var(--text-3); line-height: 1.35; }

ul.plain { padding-left: 1.1em; margin: 0 0 14px; color: var(--text-2); }
ul.plain li { margin-bottom: 8px; }
.note { border-left: 2px solid var(--gold); padding: 4px 0 4px 16px; margin: 18px 0; }
footer { margin-top: 64px; padding-top: 18px; border-top: 1px solid var(--rule); font-size: 13px; color: var(--text-3); }
a { color: var(--gold-lit); }
@media (max-width: 560px) {
  .findings li { grid-template-columns: 1fr; gap: 8px; }
  .chip { justify-self: start; }
  .chart { height: 360px; }
  .chart.tall { height: 460px; }
}
</style>
